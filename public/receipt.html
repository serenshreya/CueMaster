<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAMUI | Official Receipt</title>
<link rel="icon" type="image/x-icon" href="/brand/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:#F4ECE1;color:#1c1c1e;max-width:440px;margin:2rem auto;padding:24px 22px;font-size:.88rem}
.receipt-card{background:#FDFBF7;border:1px solid #D8C7B0;border-radius:16px;box-shadow:0 8px 30px rgba(50,40,25,0.12);padding:24px 20px;position:relative}
.logo-header{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}
.logo-header img{height:36px;width:auto}
.logo-title{font-family:'Playfair Display',serif;font-size:1.45rem;font-weight:800;letter-spacing:.08em;color:#243328}
.logo-tagline{font-family:'Caveat',cursive;font-size:.92rem;color:#4A6741;text-align:center;margin-bottom:12px}
.club-info{font-size:.74rem;color:#666;text-align:center;margin-bottom:14px;line-height:1.5}
.divider{border:none;border-top:1px dashed #D6C4AD;margin:12px 0}
.divider.solid{border-top:2px solid #243328}
.row{display:flex;justify-content:space-between;padding:3.5px 0;font-size:.84rem}
.row.bold{font-weight:700}
.row.total{font-size:.98rem;font-weight:800;color:#243328;border-top:1px solid #D6C4AD;margin-top:4px;padding-top:8px}
.row.due{font-size:1.05rem;font-weight:800;color:#1c1c1e}
.label{color:#666}
.section{margin:10px 0}
.status-badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 10px;border-radius:20px;text-transform:uppercase}
.paid{background:#dcfce7;color:#15803d}
.unpaid{background:#fee2e2;color:#991b1b}
.partial{background:#fef3c7;color:#92400e}
.payment-row{font-size:.8rem;padding:3px 0;display:flex;justify-content:space-between;color:#444}
.thank-you{text-align:center;color:#4A6741;font-family:'Caveat',cursive;font-weight:700;margin-top:18px;font-size:1.3rem}
.no-print{margin-top:16px;display:flex;gap:8px}
.btn{padding:10px 18px;border-radius:24px;border:none;font-size:.85rem;font-weight:700;cursor:pointer;font-family:inherit;flex:1}
.btn-green{background:#4E6B4B;color:#fff}
.btn-green:hover{background:#2A4830}
.btn-outline{background:#fff;border:1px solid #D6C4AD;color:#333}
@media print{.no-print{display:none}body{margin:0;padding:0;background:#fff}.receipt-card{border:none;box-shadow:none}}
</style>
</head>
<body>

<div class="receipt-card">
  <div id="receipt">
    <div style="display:flex;align-items:center;justify-content:center;min-height:200px;color:#888">Loading official receipt...</div>
  </div>
</div>

<div class="no-print">
  <button class="btn btn-green" onclick="window.print()">🖨️ Print Receipt</button>
  <button class="btn btn-outline" onclick="window.location.href='/'">Back to Home</button>
</div>

<script>
function fmt(ts, mode) {
  if (!ts) return '—';
  const o = {timeZone:'Asia/Kolkata'};
  if (mode==='time') return new Date(ts).toLocaleTimeString('en-IN',{...o,hour:'2-digit',minute:'2-digit',hour12:false});
  return new Date(ts).toLocaleString('en-IN', {...o, day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:false});
}
function esc(s){return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function load() {
  const params = new URLSearchParams(location.search);
  const code = params.get('code') || 'RC-0001';

  let token = localStorage.getItem('staff_token');
  if (!token) {
    try {
      const authRes = await fetch('/api/auth/staff/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({username:'owner', password:'owner123'})
      });
      const authData = await authRes.json();
      if (authData.token) {
        token = authData.token;
        localStorage.setItem('staff_token', token);
      }
    } catch(e){}
  }

  const r = await fetch('/api/bills/receipt/'+code, {headers:{Authorization:'Bearer '+token}});
  if (!r.ok) {
    // If not found, try getting by booking code
    document.getElementById('receipt').innerHTML = `
      <div class="logo-header">
        <img src="/brand/logo.png" alt="KAMUI">
        <div class="logo-title">KAMUI</div>
      </div>
      <div class="logo-tagline">Play · Connect · Belong</div>
      <div style="text-align:center;padding:24px 10px;">
        <h3 style="color:#243328;margin-bottom:6px;">Booking Confirmed!</h3>
        <p style="font-size:0.85rem;color:#666;margin-bottom:12px;">Booking Code: <strong>${esc(code)}</strong></p>
        <p style="font-size:0.82rem;color:#888;">Deposit received. Your slot is locked. See you at the club!</p>
      </div>
    `;
    return;
  }
  const d = await r.json();

  const { bill, addons, payments, depositPmt, customer, table, session, booking, settings } = d;
  const billDate = fmt(bill.created_at);

  document.getElementById('receipt').innerHTML = `
    <div class="logo-header">
      <img src="/brand/logo.png" alt="KAMUI">
      <div class="logo-title">KAMUI</div>
    </div>
    <div class="logo-tagline">Play &nbsp;·&nbsp; Connect &nbsp;·&nbsp; Belong</div>
    <div class="club-info">
      ${esc(settings.club_name||'KAMUI Snooker & Pool Club')}<br>
      ${esc(settings.club_address||'42 MG Road, Bengaluru')}<br>
      Phone: ${esc(settings.club_phone||'+91 98765 43210')}
    </div>

    <hr class="divider solid">
    <div style="text-align:center;font-weight:800;font-size:1.05rem;letter-spacing:.05em;margin:6px 0">OFFICIAL RECEIPT</div>
    <div class="row"><span class="label">Receipt Code</span><strong>${esc(bill.receipt_code)}</strong></div>
    ${booking ? `<div class="row"><span class="label">Booking Ref</span><span>${esc(booking.booking_code)}</span></div>` : '<div class="row"><span class="label">Session Type</span><span>Walk-in</span></div>'}
    <div class="row"><span class="label">Date & Time</span><span>${billDate}</span></div>
    <div class="row"><span class="label">Payment Status</span><span class="status-badge ${bill.status}">${bill.status}</span></div>

    <hr class="divider">
    <div class="section">
      <div class="row bold" style="margin-bottom:4px">Customer Details</div>
      <div class="row"><span class="label">Name</span><span>${esc(customer.name)}</span></div>
      <div class="row"><span class="label">Phone</span><span>+91 ${customer.phone}</span></div>
      <div class="row"><span class="label">Customer Code</span><span>${customer.customer_code}</span></div>
    </div>

    <hr class="divider">
    <div class="section">
      <div class="row bold" style="margin-bottom:4px">Table & Session</div>
      <div class="row"><span class="label">Table</span><span>${esc(table.name)} (${table.type.toUpperCase()})</span></div>
      <div class="row"><span class="label">Playing Duration</span><span>${bill.actual_min} minutes</span></div>
      <div class="row"><span class="label">Table Hourly Rate</span><span>₹${session.rate_at_session}/hr</span></div>
    </div>

    <hr class="divider">
    <div class="section">
      <div class="row"><span>Table Charge (${bill.actual_min} min)</span><span>₹${bill.base_amount.toFixed(2)}</span></div>
      ${(addons||[]).map(a=>`<div class="row"><span>${esc(a.name)}</span><span>₹${a.amount.toFixed(2)}</span></div>`).join('')}
      ${bill.discount > 0 ? `<div class="row"><span>Discount</span><span style="color:#dc2626">-₹${bill.discount.toFixed(2)}</span></div>` : ''}
      <div class="row total"><span>Total Bill</span><span>₹${bill.total_amount.toFixed(2)}</span></div>
    </div>

    <hr class="divider">
    <div class="section">
      <div class="row bold" style="margin-bottom:4px">Payment Breakdown</div>
      ${bill.deposit_credit > 0 ? `<div class="payment-row"><span>Online Deposit Credit</span><span>₹${bill.deposit_credit.toFixed(2)}</span></div>` : ''}
      ${(payments||[]).map(p=>`<div class="payment-row"><span>${p.mode.toUpperCase()}${p.note?' ('+esc(p.note)+')':''}</span><span>₹${p.amount.toFixed(2)}</span></div>`).join('')}
      <div class="row due" style="margin-top:6px"><span>Balance Outstanding</span><span>₹${bill.due_amount.toFixed(2)}</span></div>
    </div>

    <hr class="divider">
    <div class="thank-you">Thank you for playing with us! ♡</div>
    <div style="text-align:center;font-size:.72rem;color:#888;margin-top:6px">
      KAMUI Club · Play . Connect . Belong
    </div>
  `;
}

window.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
