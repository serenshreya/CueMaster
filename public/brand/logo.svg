<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Soft warm background radial glow -->
    <radialGradient id="sunGlow" cx="42%" cy="32%" r="28%">
      <stop offset="0%" stop-color="#f0bda8" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#f6cca0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fcf8f0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded Card Base -->
  <rect x="20" y="20" width="560" height="560" rx="110" ry="110" fill="#f5ede0" stroke="#71826f" stroke-width="7"/>

  <!-- Peach Watercolor Sun -->
  <circle cx="250" cy="210" r="115" fill="url(#sunGlow)"/>

  <!-- Torii Gate (Sumi-e Brushstroke Effect) -->
  <g fill="#28352b" id="torii-gate">
    <!-- Top curved roof beam (Kasagi & Shimaki) -->
    <path d="M 180 185 C 230 162 340 148 425 125 C 445 120 460 128 445 142 C 400 178 300 200 185 220 C 170 223 165 210 180 185 Z" opacity="0.95"/>
    <path d="M 195 192 C 265 170 365 155 435 138 C 420 152 320 180 200 212 Z" opacity="0.4"/>

    <!-- Left Pillar (Hashira) -->
    <path d="M 218 200 C 220 250 216 310 210 375 C 222 376 238 375 250 374 C 255 315 258 255 255 195 C 242 196 228 198 218 200 Z"/>
    <path d="M 210 310 C 208 340 204 368 202 378 C 206 378 214 378 218 377 C 220 340 224 300 226 260 Z" opacity="0.75"/>

    <!-- Right Pillar (Hashira) -->
    <path d="M 345 178 C 347 240 344 310 338 372 C 352 373 372 372 380 371 C 385 310 387 240 384 172 C 370 174 355 176 345 178 Z"/>

    <!-- Middle Tie Beam (Nuki) -->
    <path d="M 195 248 C 245 244 350 236 400 232 C 404 246 398 256 388 258 C 340 262 245 270 200 274 C 194 265 192 254 195 248 Z"/>

    <!-- Central Support Strut (Gakuzuka) -->
    <rect x="294" y="196" width="22" height="48" rx="2"/>
  </g>

  <!-- Sakura Branch & Flowers on Right Pillar -->
  <g id="cherry-blossoms">
    <path d="M 372 300 C 395 285 418 245 448 232 C 452 230 450 238 444 245 C 420 275 390 312 370 320 Z" fill="#6d5843"/>
    <path d="M 405 282 C 422 290 440 295 460 292" stroke="#6d5843" stroke-width="4" stroke-linecap="round" fill="none"/>

    <path d="M 445 215 C 460 210 472 225 458 235 C 445 230 440 220 445 215 Z" fill="#587754"/>
    <path d="M 425 240 C 440 245 448 260 435 268 C 424 260 420 248 425 240 Z" fill="#728f6e"/>
    <path d="M 420 310 C 438 312 445 325 432 334 C 420 326 416 318 420 310 Z" fill="#587754"/>

    <!-- Upper Blossom -->
    <g transform="translate(432, 230)">
      <circle cx="0" cy="-22" r="17" fill="#fff9f8" stroke="#eedcd6" stroke-width="1.5"/>
      <circle cx="21" cy="-7" r="17" fill="#fff5f4" stroke="#eedcd6" stroke-width="1.5"/>
      <circle cx="13" cy="18" r="17" fill="#fff9f8" stroke="#eedcd6" stroke-width="1.5"/>
      <circle cx="-13" cy="18" r="17" fill="#fff7f6" stroke="#eedcd6" stroke-width="1.5"/>
      <circle cx="-21" cy="-7" r="17" fill="#fffbfa" stroke="#eedcd6" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="11" fill="#f4a89f" opacity="0.75"/>
      <path d="M 0 0 L -6 -8 M 0 0 L 0 -10 M 0 0 L 7 -7 M 0 0 L 8 4 M 0 0 L -7 5" stroke="#cf6255" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="3" fill="#cf5042"/>
    </g>

    <!-- Lower Blossom -->
    <g transform="translate(415, 290)">
      <circle cx="0" cy="-20" r="15" fill="#fff7f5" stroke="#eedcd6" stroke-width="1.5"/>
      <circle cx="19" cy="-6" r="15" fill="#fffbfb" stroke="#eedcd6" stroke-width="1.5"/>
      <circle cx="12" cy="16" r="15" fill="#fff5f3" stroke="#eedcd6" stroke-width="1.5"/>
      <circle cx="-12" cy="16" r="15" fill="#fff8f7" stroke="#eedcd6" stroke-width="1.5"/>
      <circle cx="-19" cy="-6" r="15" fill="#fffaf9" stroke="#eedcd6" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="9" fill="#f4a89f" opacity="0.75"/>
      <path d="M 0 0 L -5 -7 M 0 0 L 1 -9 M 0 0 L 6 -6 M 0 0 L 7 3 M 0 0 L -6 4" stroke="#cf6255" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.5" fill="#cf5042"/>
    </g>

    <ellipse cx="462" cy="200" rx="9" ry="14" fill="#f3beb7" transform="rotate(30 462 200)"/>
    <path d="M 458 206 C 452 214 456 220 464 216" stroke="#587754" stroke-width="3" fill="none"/>

    <!-- Petals -->
    <ellipse cx="170" cy="270" rx="9" ry="16" fill="#f5c2bc" transform="rotate(-35 170 270)" opacity="0.85"/>
    <ellipse cx="185" cy="335" rx="8" ry="14" fill="#f3beb7" transform="rotate(25 185 335)" opacity="0.8"/>
    <ellipse cx="468" cy="345" rx="9" ry="15" fill="#f5c2bc" transform="rotate(40 468 345)" opacity="0.85"/>
  </g>

  <!-- Typography -->
  <text x="300" y="475" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="94" font-weight="800" letter-spacing="14" fill="#243328">KAMUI</text>
  <text x="300" y="525" text-anchor="middle" font-family="'Caveat', cursive, sans-serif" font-size="42" font-weight="600" fill="#465a49">Play &nbsp;·&nbsp; Connect &nbsp;·&nbsp; Belong</text>
</svg>
